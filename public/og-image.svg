<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E1B4B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E7FF"/>
      <stop offset="100%" style="stop-color:#A5B4FC"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative gradient orbs -->
  <circle cx="100" cy="100" r="200" fill="#4F46E5" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="250" fill="#7C3AED" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Left side: Icon -->
  <g transform="translate(180, 315)">
    <!-- Gear -->
    <g transform="scale(1.2)">
      <path d="M0,-100 L15,-98 L18,-85 L25,-87 L36,-100 L47,-93 L43,-78 L50,-75 L64,-84 L72,-72 L61,-61 L66,-54 L82,-57 L84,-42 L72,-36 L73,-27 L90,-22 L87,-6 L72,-4 L72,4 L87,6 L90,22 L73,27 L72,36 L84,42 L82,57 L66,54 L61,61 L72,72 L64,84 L50,75 L43,78 L47,93 L36,100 L25,87 L18,85 L15,98 L0,100 L-15,98 L-18,85 L-25,87 L-36,100 L-47,93 L-43,78 L-50,75 L-64,84 L-72,72 L-61,61 L-66,54 L-82,57 L-84,42 L-72,36 L-73,27 L-90,22 L-87,6 L-72,4 L-72,-4 L-87,-6 L-90,-22 L-73,-27 L-72,-36 L-84,-42 L-82,-57 L-66,-54 L-61,-61 L-72,-72 L-64,-84 L-50,-75 L-43,-78 L-47,-93 L-36,-100 L-25,-87 L-18,-85 L-15,-98 Z" 
            fill="url(#gearGrad)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="40" fill="#0F172A"/>
      
      <!-- Code symbol -->
      <g fill="#E0E7FF" font-family="Monaco, 'Courier New', monospace" font-weight="bold">
        <text x="-18" y="8" font-size="32">&lt;/&gt;</text>
      </g>
    </g>
    
    <!-- Checkmark badge -->
    <g transform="translate(75, 75)">
      <circle cx="0" cy="0" r="40" fill="#1E293B"/>
      <circle cx="0" cy="0" r="34" fill="url(#greenGrad)"/>
      <path d="M-14,0 L-5,9 L16,-12" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Right side: Text content -->
  <g transform="translate(420, 200)">
    <!-- Title -->
    <text x="0" y="0" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" filter="url(#textShadow)">
      Gear PR Review
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">
      AI-Powered Code Review Tool
    </text>
    
    <!-- Divider -->
    <rect x="0" y="90" width="120" height="4" rx="2" fill="url(#accentGrad)"/>
    
    <!-- Features -->
    <g transform="translate(0, 140)" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="22">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="-6" r="4" fill="#10B981"/>
        <text x="24" y="0">Automated Bug Detection</text>
      </g>
      <g transform="translate(0, 40)">
        <circle cx="8" cy="-6" r="4" fill="#10B981"/>
        <text x="24" y="0">Security Vulnerability Analysis</text>
      </g>
      <g transform="translate(0, 80)">
        <circle cx="8" cy="-6" r="4" fill="#10B981"/>
        <text x="24" y="0">Jira/Confluence Integration</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="8" cy="-6" r="4" fill="#10B981"/>
        <text x="24" y="0">PRD/TDD Requirement Tracking</text>
      </g>
    </g>
  </g>
  
  <!-- Bottom right: Author -->
  <g transform="translate(1020, 580)">
    <rect x="0" y="-24" width="120" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="60" y="-2" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      NhoNH
    </text>
  </g>
</svg>
